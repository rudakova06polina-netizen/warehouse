<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>Вход — Склад техники</title>
<link rel="stylesheet" href="/style.css"></head>
<body>
<div class="card auth">
  <h2>Вход</h2>
  <form method="post" action="/login">
    <input name="username" placeholder="Логин" required>
    <input name="password" type="password" placeholder="Пароль" required>
    <button type="submit">Войти</button>
  </form>
  <p class="err" id="e"></p>
  <p><a href="/register.html">Регистрация</a></p>
</div>
<script>if(location.search.includes('error'))document.getElementById('e').textContent='Неверный логин или пароль';</script>
</body></html>
